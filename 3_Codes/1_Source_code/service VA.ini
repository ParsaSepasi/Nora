[Unit]
Description=Voice Assistant (Vosk) - User Service
After=default.target

[Service]
Type=simple
WorkingDirectory=%h/voice-assistant/app
Environment=PYTHONUNBUFFERED=1
Environment=WS_SERVER_URL=http://127.0.0.1:8080
ExecStart=%h/voice-assistant/.venv/bin/python %h/voice-assistant/app/main.py
Restart=on-failure
RestartSec=3
KillSignal=SIGINT
TimeoutStopSec=10
StandardOutput=journal
StandardError=journal
SyslogIdentifier=voice-assistant

# user services معمولاً به PipeWire/Pulse همان کاربر دسترسی دارند؛
# اگر نیاز به اولویت داری:
# Nice=-5

[Install]
WantedBy=default.target
